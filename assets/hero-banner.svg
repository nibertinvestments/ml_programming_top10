<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="0.52" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="90" y1="70" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="40" x2="340" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1280" cy="78" r="130" fill="#172033"/>
  <circle cx="1290" cy="80" r="72" fill="#1E293B" opacity="0.84"/>
  <circle cx="220" cy="330" r="170" fill="#0B1220" opacity="0.9"/>

  <rect x="72" y="66" width="1256" height="288" rx="30" fill="url(#panel)" stroke="#334155" stroke-opacity="0.6"/>

  <g>
    <rect x="108" y="110" width="220" height="170" rx="22" fill="url(#accent)" opacity="0.18"/>
    <rect x="128" y="128" width="180" height="134" rx="18" fill="#0B1220" stroke="#7DD3FC" stroke-opacity="0.3"/>
    <text x="154" y="183" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700">ML</text>
    <text x="154" y="232" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Programming</text>
  </g>

  <g>
    <text x="392" y="178" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">Top 10</text>
    <text x="392" y="223" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">Multilingual code corpus for</text>
    <text x="392" y="260" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">LLM and ML training</text>

    <g filter="url(#glow)">
      <rect x="392" y="286" width="140" height="32" rx="16" fill="#38BDF8"/>
      <text x="420" y="307" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">10 LANGUAGES</text>

      <rect x="546" y="286" width="174" height="32" rx="16" fill="#8B5CF6"/>
      <text x="575" y="307" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1200 RECORDS</text>

      <rect x="734" y="286" width="200" height="32" rx="16" fill="#22C55E"/>
      <text x="764" y="307" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">TRAIN / VAL / TEST</text>
    </g>
  </g>

  <g>
    <rect x="1020" y="125" width="250" height="168" rx="18" fill="#0B1220" stroke="#334155" stroke-opacity="0.8"/>
    <text x="1046" y="165" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">LANGUAGES</text>
    <g fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
      <text x="1046" y="198">Python</text>
      <text x="1046" y="226">JavaScript</text>
      <text x="1046" y="254">TypeScript</text>
    </g>
    <g fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
      <text x="1178" y="198">Go</text>
      <text x="1178" y="226">Rust</text>
      <text x="1178" y="254">Java</text>
    </g>
    <g fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
      <text x="1046" y="282">C#</text>
      <text x="1178" y="282">C++</text>
    </g>
  </g>
</svg>
